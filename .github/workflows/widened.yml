name: widened

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The apply completes. This step fails because the check names each mistake.
      - name: Refuse the widened stack
        run: bash scripts/reject
