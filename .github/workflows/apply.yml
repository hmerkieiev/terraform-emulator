name: apply

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No cloud credentials in this job. The script refuses any other caller.
      - name: Apply
        run: bash scripts/apply
      - name: Reject the widened stack
        run: bash scripts/reject
